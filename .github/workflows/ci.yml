name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Interfaccia (TypeScript + build)
        run: pnpm build
      - name: Manuale (immagini e link)
        run: pnpm docs:check
      - name: Backend (Rust)
        working-directory: src-tauri
        run: cargo test
      - name: Interfaccia con backend finto (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot
          path: scripts/smoke/out
          if-no-files-found: ignore

  # whisper.cpp with Metal is compiled only here (Linux builds the CPU version).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Backend (Rust, Metal)
        working-directory: src-tauri
        run: cargo test --lib

  # Only compiles (whisper.cpp and its bindings are the part that differs on Windows): the
  # release found out too late that Windows did not build.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # whisper-rs-sys makes its Rust bindings with bindgen, which needs libclang: without it it
      # falls back to bindings made on Linux, whose struct sizes are wrong for MSVC (E0080).
      - name: libclang per whisper-rs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Backend (Rust, Windows)
        working-directory: src-tauri
        shell: pwsh
        run: |
          # whisper-rs-sys says why bindgen failed only with -vv (warnings of dependencies are hidden).
          cargo build --lib -vv *> build.log
          Select-String -Path build.log -Pattern "Unable to generate|bundled bindings" -Context 0,8
          cargo test --lib
