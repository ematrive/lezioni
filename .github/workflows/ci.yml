name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Interfaccia (TypeScript + build)
        run: pnpm build
      - name: Manuale (immagini e link)
        run: pnpm docs:check
      - name: Backend (Rust)
        working-directory: src-tauri
        run: cargo test
      - name: Interfaccia con backend finto (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot
          path: scripts/smoke/out
          if-no-files-found: ignore

  # whisper.cpp with Metal is compiled only here (Linux builds the CPU version).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Backend (Rust, Metal)
        working-directory: src-tauri
        run: cargo test --lib

  # Only compiles (whisper.cpp and its bindings are the part that differs on Windows): the
  # release found out too late that Windows did not build.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # src-tauri/.cargo/config.toml makes whisper-rs-sys use the bindings bundled in the crate
      # (made on Linux: fine for Linux and macOS, wrong struct sizes for MSVC, error E0080). On
      # Windows they are made with bindgen instead, which needs libclang (installed on the runner).
      - name: Binding di whisper-rs generati per Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-Content src-tauri/.cargo/config.toml) | Where-Object { $_ -notmatch 'WHISPER_DONT_GENERATE_BINDINGS' } | Set-Content src-tauri/.cargo/config.toml
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Backend (Rust, Windows)
        working-directory: src-tauri
        run: cargo test --lib
