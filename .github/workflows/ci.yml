name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Interfaccia (TypeScript + build)
        run: pnpm build
      - name: Backend (Rust)
        working-directory: src-tauri
        run: cargo test
      - name: Interfaccia con backend finto (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: scripts/smoke/out
          if-no-files-found: ignore
